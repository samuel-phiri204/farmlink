
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Contact Us | FarmLink</title>
  <link rel="stylesheet" href="style.css">
  <script src="java.js" defer></script>
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="page-banner">
    <h2>Contact FarmLink</h2>
    <p>We welcome questions and inquiries
    about the cooperative.</p>
  </section>

  <section class="section">
    <h2>Get in Touch</h2>
    <div class="card-grid">
      <article class="card">
        <h3>Location</h3>
        <p>Zambia</p>
        <p>Ndola, Copperbelt Province</p>
      </article>

      <article class="card">
        <h3>Telephone</h3>
        <p>0956345347</p>
      </article>

      <article class="card">
        <h3>Email</h3>
        <p>Farmlink@farmLink.com</p>
      </article>
    </div>
  </section>

  <section class="section form-section">
  <h2>Send Us a Message</h2>
  <p>Fill in the form and we will get back to you.</p>

  <form id="contact-form">
    <label for="contact-name">Full Name</label>
    <input id="contact-name" type="text" required>

    <label for="contact-email">Email Address</label>
    <input id="contact-email" type="email" required>

    <label for="contact-subject">Subject</label>
    <select id="contact-subject" required>
      <option value="">Choose a subject</option>
      <option>Membership</option>
      <option>Farm Inputs</option>
      <option>Farm Products</option>
      <option>General Inquiry</option>
    </select>

    <label for="contact-message">Message</label>
    <textarea id="contact-message" rows="6" required></textarea>

    <button type="submit">Send Message</button>
    <p id="contact-status" role="status"></p>
  </form>

  <script>
    document.getElementById("contact-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("contact-status");

      try {
        const res = await fetch("/api/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("contact-name").value,
            email: document.getElementById("contact-email").value,
            subject: document.getElementById("contact-subject").value,
            message: document.getElementById("contact-message").value
          })
        });
        const data = await res.json();
        status.textContent = data.message || data.error;
        if (res.ok) e.target.reset();
      } catch (err) {
        status.textContent = "Could not reach the server. Please try again.";
      }
    });
  </script>
</section>
</main>

<div id="site-footer"></div>
</body>
</html>
